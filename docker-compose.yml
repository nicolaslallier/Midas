services:
  backend:
    image: midas-backend:${MIDAS_TAG:-dev}
    build:
      context: ./backend
    restart: unless-stopped

  functionapp:
    image: midas-functionapp:${MIDAS_TAG:-dev}
    build:
      context: ./functionapp
    restart: unless-stopped

  frontend:
    image: midas-frontend:${MIDAS_TAG:-dev}
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
